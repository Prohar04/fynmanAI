# Render Blueprint for Feynman AI
# The backend container runs migrations, the API and the BullMQ worker
# together via server/scripts/docker-start.sh, so one web service is enough.

databases:
  - name: fynman-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - name: fynman-redis
    type: keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction # BullMQ requires noeviction

  - name: fynman-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: WS_PATH
        value: /ws

      - key: DATABASE_URL
        fromDatabase:
          name: fynman-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: fynman-redis
          type: keyvalue
          property: connectionString

      # Auto-generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 5m
      - key: REFRESH_JWT_EXPIRES_IN
        value: 15d
      - key: COOKIE_SAME_SITE
        value: none

      # MVP feature flags
      - key: ENABLE_AUDIO_PROCESSING_QUEUE
        value: true
      - key: ENABLE_REALTIME_FEEDBACK
        value: true
      - key: ENABLE_FINAL_EVALUATION
        value: true

      # Set these in the Render dashboard (not stored in git)
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: OPEN_ROUTER_APIKEY
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: ARCJET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SECURE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
